# cargo-about configuration for the Rust crates linked into port-forwarder.exe with Slint
# (notices.py). Only what ships: the Windows x64 target, no build or dev dependencies.
#
# Accepted licences, in order of preference. Slint's own crates are "GPL-3.0-only OR
# LicenseRef-Slint-Royalty-free-2.0 OR LicenseRef-Slint-Software-3.0"; GPL-3.0 is not on this
# list, so that the Royalty-free licence is the one chosen -- and so that a dependency that
# could only be had under the GPL fails the generation instead of slipping in.
accepted = [
    "LicenseRef-Slint-Royalty-free-2.0",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "MIT-0",
    "0BSD",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "Unlicense",
    "MPL-2.0",
    "OFL-1.1",
    "NCSA",
    "CDLA-Permissive-2.0",
]
targets = ["x86_64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
no-clearly-defined = true
