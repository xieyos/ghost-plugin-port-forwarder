name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    # windows-2022 is the image that still carries Visual Studio 2022 (17.x);
    # windows-latest has moved to an image without it.
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      # The public SDK whose packer the packing check runs -- the same commit release.yml
      # packs and signs with (tests/check_workflows.py keeps the two equal).
      SDK_REPO: liliBestCoder/ghost-plugin-sdk
      SDK_REF: bb0c51dc64587e0dbe898fd554593eb28438a11a
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          repository: ${{ env.SDK_REPO }}
          ref: ${{ env.SDK_REF }}
          path: _sdk
          sparse-checkout: tools/plugin
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.12'

      # PF_REQUIRE_PACK_TEST: in CI a missing Python or SDK fails the packing check instead
      # of skipping it.
      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DPF_REQUIRE_PACK_TEST=ON "-DPF_GHOST_SDK_DIR=$env:GITHUB_WORKSPACE/_sdk"

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
